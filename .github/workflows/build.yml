name: Build and publish release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

# Prevent different version-tag workflows from editing release assets together.
concurrency:
  group: updater-release-publishing
  cancel-in-progress: false

jobs:
  build:
    name: Build ${{ matrix.name }} installer
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      # Each runner updates the same GitHub Release and latest.json asset.
      max-parallel: 1
      matrix:
        include:
          - name: windows
            runner: windows-latest
            bundles: msi,nsis
          - name: linux
            runner: ubuntu-22.04
            bundles: deb,appimage
          - name: macos
            runner: macos-latest
            bundles: dmg

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install frontend dependencies
        run: npm ci

      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            curl \
            file \
            libayatana-appindicator3-dev \
            libdbus-1-dev \
            libssl-dev \
            libwebkit2gtk-4.1-dev \
            librsvg2-dev \
            libxdo-dev \
            patchelf \
            wget

      - name: Build and publish signed installers
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: Spacetime Studio ${{ github.ref_name }}
          releaseBody: Installers and signed updater bundles for Spacetime Studio.
          releaseDraft: false
          prerelease: false
          uploadUpdaterJson: true
          args: --bundles ${{ matrix.bundles }}
