<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Spacetime Studio</title>
    <script>
      try {
        const preference = localStorage.getItem("spacetime-studio.theme");
        const dark = preference === "dark" || (preference !== "light" && matchMedia("(prefers-color-scheme: dark)").matches);
        if (dark) document.documentElement.classList.add("dark");
      } catch {}
    </script>
    <style>
      :root { color-scheme: light; --launch-bg: #fafafa; --launch-title: #18181b; --launch-muted: #71717a; --launch-track: #e4e4e7; --launch-accent: #52525b; }
      :root.dark { color-scheme: dark; --launch-bg: #09090b; --launch-title: #fafafa; --launch-muted: #a1a1aa; --launch-track: #27272a; --launch-accent: #a1a1aa; }
      html, body, #app { width: 100%; height: 100%; margin: 0; }
      body { background: var(--launch-bg); }
      .launch-screen { display: flex; width: 100%; height: 100%; align-items: center; justify-content: center; flex-direction: column; gap: 0; background: var(--launch-bg); color: var(--launch-title); font-family: Inter, ui-sans-serif, system-ui, sans-serif; }
      .launch-mark { position: relative; display: grid; width: 42px; height: 42px; place-items: center; margin-bottom: 18px; }
      .launch-spinner { position: absolute; inset: 0; border: 2px solid var(--launch-track); border-top-color: var(--launch-accent); border-radius: 50%; animation: launch-spin 0.9s linear infinite; }
      .launch-core { width: 9px; height: 9px; border-radius: 3px; background: var(--launch-accent); animation: launch-pulse 1.4s ease-in-out infinite; }
      .launch-title { margin: 0; font-size: 15px; font-weight: 600; letter-spacing: -0.01em; }
      .launch-caption { margin: 5px 0 0; color: var(--launch-muted); font-size: 12px; }
      @keyframes launch-spin { to { transform: rotate(360deg); } }
      @keyframes launch-pulse { 50% { opacity: 0.55; transform: scale(0.82); } }
      @media (prefers-reduced-motion: reduce) { .launch-spinner, .launch-core { animation-duration: 3s; } }
    </style>
  </head>

  <body>
    <div id="app" class="isolate">
      <div class="launch-screen" role="status" aria-live="polite">
        <div class="launch-mark" aria-hidden="true"><span class="launch-spinner"></span><span class="launch-core"></span></div>
        <p class="launch-title">Spacetime Studio</p>
        <p class="launch-caption">Loading your workspace</p>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
